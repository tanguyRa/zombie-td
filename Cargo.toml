[workspace]
resolver = "2"
members = ["crates/sim-core", "crates/sim-headless", "crates/sim-wasm"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
panic = "abort"

[profile.release.package.sim-wasm]
opt-level = 3
