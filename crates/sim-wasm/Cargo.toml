[package]
name = "sim-wasm"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sim-core = { path = "../sim-core" }
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
serde_json = "1"
serde = "1"

[dev-dependencies]
wasm-bindgen-test = "=0.3.50"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
